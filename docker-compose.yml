services:
  database:
    container_name: ${PROJECT_NAME}_database
    image: mariadb:11.4
    ports:
      - ${LOCAL_DB_PORT}:3306
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_USER: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
      MARIADB_AUTO_UPGRADE: '1'
  wordpress:
    container_name: ${PROJECT_NAME}_wordpress
    depends_on:
      - database
      - mailpit
    build:
      context: ./docker/wordpress
    tty: true
    ports:
      - ${LOCAL_SERVER_PORT}:80
    working_dir: /var/www/html/public_html/wp
    volumes:
      - ./mu-plugins:/var/www/html/mu-plugins
      - ./theme:/var/www/html/themes/${PROJECT_NAME}
      - ./docker/wordpress/mount:/var/www/html/mount
      - ~/.ssh:/root/.ssh
    environment:
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: wordpress
      DB_HOST: database:3306
      PROJECT_NAME: ${PROJECT_NAME}
      PLUGIN_ACF_KEY: ${PLUGIN_ACF_KEY}
      WP_ENVIRONMENT_TYPE: local
      LOCAL_SERVER_PORT: '${LOCAL_SERVER_PORT}'
      PRODUCTION_HOST: '${PRODUCTION_HOST}'
      PRODUCTION_DIR_PATH: '${PRODUCTION_DIR_PATH}'
      PRODUCTION_SSH_HOST: '${PRODUCTION_SSH_HOST}'
      PRODUCTION_DB_NAME: '${PRODUCTION_DB_NAME}'
      PRODUCTION_DB_USER: '${PRODUCTION_DB_USER}'
      PRODUCTION_DB_PASSWORD: '${PRODUCTION_DB_PASSWORD}'
      PRODUCTION_DB_HOST: '${PRODUCTION_DB_HOST}'
      STAGING_HOST: '${STAGING_HOST}'
      STAGING_DIR_PATH: '${STAGING_DIR_PATH}'
      STAGING_SSH_HOST: '${STAGING_SSH_HOST}'
      STAGING_DB_NAME: '${STAGING_DB_NAME}'
      STAGING_DB_USER: '${STAGING_DB_USER}'
      STAGING_DB_PASSWORD: '${STAGING_DB_PASSWORD}'
      STAGING_DB_HOST: '${STAGING_DB_HOST}'
  mailpit:
    image: axllent/mailpit
    container_name: ${PROJECT_NAME}_mailpit
    restart: unless-stopped
    volumes:
      - ./mailpit:/data
    ports:
      - ${LOCAL_MAILPIT_PORT}:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
volumes:
  db_data:
